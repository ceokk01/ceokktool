kind = "web"
previewPath = "/"
title = "Deriv Market Analysis"
description = "A real-time Deriv trading analysis workspace for over/under, rise/fall, even/odd, higher/lower, digit directions, differs, and accumulator setups with live tick data and account balance visibility."
version = "1.0.0"
id = "artifacts/deriv-market-analysis"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20403

[services.development]
run = "pnpm --filter @workspace/deriv-market-analysis run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/deriv-market-analysis", "run", "build" ]
serve = "static"
publicDir = "artifacts/deriv-market-analysis/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20403"
BASE_PATH = "/"
